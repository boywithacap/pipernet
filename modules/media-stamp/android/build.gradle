plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.pipermediastamp'
version = '1.0.0'

android {
  namespace 'expo.modules.pipermediastamp'
  defaultConfig {
    versionCode 1
    versionName project.version.toString()
  }
}

dependencies {
  // Keep all Media3 artifacts aligned with expo-video in SDK 57.
  implementation 'androidx.media3:media3-transformer:1.9.0'
  implementation 'androidx.media3:media3-effect:1.9.0'
}
